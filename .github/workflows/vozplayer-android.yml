name: VozPlayer Android (APK)

on:
  push:
    paths:
      - "VozPlayer_proyecto/reproductor_voz_android/**"
      - ".github/workflows/vozplayer-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VozPlayer_proyecto/reproductor_voz_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma fija (desde los secretos del repositorio)
        env:
          KEYSTORE_B64: ${{ secrets.VOZPLAYER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vozplayer.keystore"
            echo "VOZPLAYER_KEYSTORE=$RUNNER_TEMP/vozplayer.keystore" >> "$GITHUB_ENV"
            echo "Firma: FIJA (las actualizaciones conservan los datos)"
          else
            echo "::warning::Firma: TEMPORAL. Falta el secreto VOZPLAYER_KEYSTORE_B64; este APK no se podrá instalar encima de la versión anterior."
          fi

      - name: Compilar APK
        env:
          VOZPLAYER_KEYSTORE_PASSWORD: ${{ secrets.VOZPLAYER_KEYSTORE_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VozPlayer-apk
          path: VozPlayer_proyecto/reproductor_voz_android/app/build/outputs/apk/debug/app-debug.apk

      - name: Pruebas (buscador por voz y arranque de la app)
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Diagnóstico de letras en internet
        continue-on-error: true
        env:
          LETRAS_EN_LINEA: "1"
        run: bash ./gradlew --no-daemon testDebugUnitTest --tests "*LyricsOnlineTest*" --rerun-tasks
