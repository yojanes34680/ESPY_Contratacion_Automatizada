name: VozPlayer Android (APK)

on:
  push:
    paths:
      - "VozPlayer_proyecto/reproductor_voz_android/**"
      - ".github/workflows/vozplayer-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VozPlayer_proyecto/reproductor_voz_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del buscador por voz
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        run: bash ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VozPlayer-apk
          path: VozPlayer_proyecto/reproductor_voz_android/app/build/outputs/apk/debug/app-debug.apk
