name: Convertidor PSR-S950 (programa para Windows)

on:
  push:
    paths:
      - "TecladoMIDI_Yamaha/**"
      - ".github/workflows/convertidor-psr-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: TecladoMIDI_Yamaha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (núcleo + IA en CPU + empaquetador)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install demucs

      - name: Pruebas
        run: python -m pytest -q

      - name: Descargar ffmpeg (para leer MP3 y MP4)
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination ffmpeg\ffmpeg.exe

      - name: Construir ConvertidorPSR.exe
        run: |
          pyinstaller --noconfirm --clean --windowed --name ConvertidorPSR `
            --add-binary "ffmpeg\ffmpeg.exe;ffmpeg" `
            --collect-all librosa --collect-all demucs --collect-all soundfile `
            --collect-all julius --collect-all lameenc `
            --collect-submodules scipy --collect-submodules sklearn `
            --hidden-import mido.backends `
            convertidor_psr.py

      - name: Autoprueba del .exe (convierte una canción de prueba)
        run: |
          $p = Start-Process -FilePath "dist\ConvertidorPSR\ConvertidorPSR.exe" `
               -ArgumentList "--autoprueba", "$PWD\autoprueba.mid" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path autoprueba.mid)) {
            if (Test-Path autoprueba.mid.error.txt) { Get-Content autoprueba.mid.error.txt }
            throw "La autoprueba del ejecutable falló"
          }
          Write-Host "Autoprueba correcta"

      - name: Empaquetar en ZIP
        run: |
          Copy-Item LEEME_WINDOWS.txt dist\ConvertidorPSR\
          Compress-Archive -Path dist\ConvertidorPSR -DestinationPath ConvertidorPSR-Windows.zip -CompressionLevel Optimal
          "{0:N0} MB" -f ((Get-Item ConvertidorPSR-Windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ConvertidorPSR-Windows
          path: TecladoMIDI_Yamaha/ConvertidorPSR-Windows.zip

      - name: Publicar descarga en "Releases"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete convertidor-psr --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create convertidor-psr ConvertidorPSR-Windows.zip `
            --target $env:GITHUB_SHA `
            --title "Convertidor de canciones a MIDI para Yamaha PSR-S950" `
            --notes "Descargue ConvertidorPSR-Windows.zip, descomprímalo y abra ConvertidorPSR.exe. Ver LEEME_WINDOWS.txt dentro del ZIP."
